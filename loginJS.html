<script>
  function construirMenu(usuario) {
    const secLogin = document.getElementById('seccion_login');
    const secMenu = document.getElementById('seccion_menu_principal');
    if (secLogin) secLogin.classList.add('d-none');
    if (secMenu) secMenu.classList.remove('d-none');

    const bienvenida = document.getElementById('bienvenida_usuario');
    if (bienvenida) bienvenida.textContent = 'Hola, ' + ((usuario && usuario.nombre) ? usuario.nombre : '');

    const cardAsistencia = document.getElementById('card_asistencia');
    const cardAdmin = document.getElementById('card_admin');
    if (cardAsistencia) cardAsistencia.classList.add('d-none');
    if (cardAdmin) cardAdmin.classList.add('d-none');

    const rol = (usuario && usuario.rol_id != null) ? usuario.rol_id : '';
    const rolNum = parseInt(rol, 10);

    if (rol === '1' || rolNum === 1) {
      if (cardAsistencia) cardAsistencia.classList.remove('d-none');
    } else if (rol === '2' || rolNum === 2) {
      if (cardAsistencia) cardAsistencia.classList.remove('d-none');
      if (cardAdmin) cardAdmin.classList.remove('d-none');
    }
  }

  function cerrarSesion() {
    const token = _getTokenLogin_();
    try {
      sessionStorage.removeItem('ip_token');
      sessionStorage.removeItem('ip_usuario');
      sessionStorage.removeItem('ip_lastActivity');
      localStorage.removeItem('sesionIngresoPersonal');
      localStorage.removeItem('sesionIngresoPersonal_lastActivity');
    } catch (e) {}
    if (token) {
      google.script.run
        .withSuccessHandler(function () {
          window.top.location.href = window.APP_URL;
        })
        .withFailureHandler(function () {
          window.top.location.href = window.APP_URL;
        })
        .cerrarSesionToken(token);
      return;
    }
    window.top.location.href = window.APP_URL;
  }

  function procesarLogin() {
    const inputCorreo = document.getElementById('login_correo');
    const inputPass = document.getElementById('login_pass');
    const btn = document.getElementById('btn_ingresar');
    const err = document.getElementById('login_error');

    let correo = inputCorreo ? inputCorreo.value : '';
    correo = (correo || '').toString().trim();
    let pass = inputPass ? inputPass.value : '';
    pass = (pass || '').toString();

    if (err) {
      err.classList.add('d-none');
      err.textContent = '';
    }

    if (!correo) {
      if (err) {
        err.textContent = 'Ingresa tu correo.';
        err.classList.remove('d-none');
      }
      return;
    }
    if (!pass) {
      if (err) {
        err.textContent = 'Ingresa tu contraseña.';
        err.classList.remove('d-none');
      }
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Validando...';
    }

    let remember = false;
    try {
      const chk = document.getElementById('login_recordar');
      remember = !!(chk && chk.checked);
    } catch (e) {}

    window.__ip_login_remember = remember;
    window.__ip_login_correo_tmp = correo;
    window.__ip_login_pass_tmp = pass;

    if (!remember) {
      try {
        localStorage.removeItem('ip_remember_email');
        sessionStorage.removeItem('ip_remember_pass');
        sessionStorage.removeItem('ip_remember_flag');
      } catch (e) {}
    }

    google.script.run
      .withSuccessHandler(respuestaLogin)
      .withFailureHandler(function (e) {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Ingresar';
        }
        if (err) {
          err.textContent = (e && e.message) ? e.message : 'Error al validar.';
          err.classList.remove('d-none');
        }
      })
      .validarAccesoUsuario(correo, pass);
  }

  function respuestaLogin(res) {
    const btn = document.getElementById('btn_ingresar');
    const err = document.getElementById('login_error');
    const inputPass = document.getElementById('login_pass');

    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Ingresar';
    }
    if (inputPass) inputPass.value = '';

    if (!res || res.exito === false) {
      if (err) {
        err.textContent = (res && res.mensaje) ? res.mensaje : 'Error al validar.';
        err.classList.remove('d-none');
      }
      try {
        window.__ip_login_correo_tmp = '';
        window.__ip_login_pass_tmp = '';
        window.__ip_login_remember = false;
      } catch (e) {}
      return;
    }

    try {
      const remember = !!window.__ip_login_remember;
      if (remember) {
        if (window.__ip_login_correo_tmp) localStorage.setItem('ip_remember_email', String(window.__ip_login_correo_tmp));
        if (window.__ip_login_pass_tmp) sessionStorage.setItem('ip_remember_pass', String(window.__ip_login_pass_tmp));
        sessionStorage.setItem('ip_remember_flag', '1');
      }
    } catch (e) {}

    try {
      sessionStorage.setItem('ip_token', String(res.token || ''));
      sessionStorage.setItem('ip_usuario', JSON.stringify(res.usuario || {}));
      sessionStorage.setItem('ip_lastActivity', String(Date.now()));
    } catch (e) {}

    try {
      window.__ip_login_correo_tmp = '';
      window.__ip_login_pass_tmp = '';
      window.__ip_login_remember = false;
    } catch (e) {}

    window.UsuarioActual = res.usuario;
    construirMenu(res.usuario);
    if (typeof iniciarProtectorInactividad === 'function') {
      iniciarProtectorInactividad(function () {
        cerrarSesion();
      }, 5 * 60 * 1000);
    }
  }

  function _getTokenLogin_() {
    try {
      return sessionStorage.getItem('ip_token') || '';
    } catch (e) {
      return '';
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    const passEl = document.getElementById('login_pass');
    const btnToggle = document.getElementById('btn_toggle_pass');
    const iconToggle = document.getElementById('icon_toggle_pass');
    if (btnToggle && passEl) {
      btnToggle.addEventListener('click', function () {
        const isPassword = passEl.getAttribute('type') === 'password';
        passEl.setAttribute('type', isPassword ? 'text' : 'password');
        btnToggle.setAttribute('aria-pressed', isPassword ? 'true' : 'false');
        btnToggle.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
        if (iconToggle) iconToggle.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        passEl.focus();
      });
    }

    try {
      const remembered = localStorage.getItem('ip_remember_email');
      const correoEl = document.getElementById('login_correo');
      if (remembered && correoEl && !correoEl.value) correoEl.value = String(remembered);
    } catch (e) {}

    try {
      const chk = document.getElementById('login_recordar');
      const flag = sessionStorage.getItem('ip_remember_flag');
      const shouldRemember = !!(localStorage.getItem('ip_remember_email') || flag === '1');
      if (chk) chk.checked = shouldRemember;

      const passRemember = sessionStorage.getItem('ip_remember_pass');
      const passEl2 = document.getElementById('login_pass');
      if (flag === '1' && passRemember && passEl2 && !passEl2.value) passEl2.value = String(passRemember);

      if (chk) {
        chk.addEventListener('change', function () {
          if (chk.checked) return;
          try {
            localStorage.removeItem('ip_remember_email');
            sessionStorage.removeItem('ip_remember_pass');
            sessionStorage.removeItem('ip_remember_flag');
          } catch (e) {}
        });
      }
    } catch (e) {}

    if (typeof verificarSesionInactividad === 'function' && verificarSesionInactividad(5 * 60 * 1000)) return;

    const token = _getTokenLogin_();
    if (!token) return;

    google.script.run
      .withSuccessHandler(function (r) {
        if (!r || r.exito === false) return;
        try {
          sessionStorage.setItem('ip_usuario', JSON.stringify(r.usuario || {}));
          sessionStorage.setItem('ip_lastActivity', String(Date.now()));
        } catch (e) {}
        window.UsuarioActual = r.usuario;
        construirMenu(r.usuario);
        if (typeof iniciarProtectorInactividad === 'function') {
          iniciarProtectorInactividad(function () {
            cerrarSesion();
          }, 5 * 60 * 1000);
        }
      })
      .withFailureHandler(function () {})
      .obtenerSesionActual(token);
  });
</script>
