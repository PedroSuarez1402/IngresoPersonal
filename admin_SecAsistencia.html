<div id="sec_asistencia">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
    <div>
      <div class="h4 mb-0">Asistencia</div>
      <div class="text-muted small">Consulta y filtra marcaciones.</div>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-md-4">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-3">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <div class="text-muted small">Total Marcaciones</div>
              <div id="kpi_total" class="fs-3 fw-semibold">0</div>
            </div>
            <div class="rounded-circle bg-primary bg-opacity-10 text-primary d-flex align-items-center justify-content-center" style="width: 44px; height: 44px;">
              <i class="bi bi-list-check fs-5"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-3">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <div class="text-muted small">A Tiempo</div>
              <div id="kpi_atiempo" class="fs-3 fw-semibold text-success">0</div>
            </div>
            <div class="rounded-circle bg-success bg-opacity-10 text-success d-flex align-items-center justify-content-center" style="width: 44px; height: 44px;">
              <i class="bi bi-check2-circle fs-5"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-3">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <div class="text-muted small">Retrasos</div>
              <div id="kpi_retrasos" class="fs-3 fw-semibold text-danger">0</div>
            </div>
            <div class="rounded-circle bg-danger bg-opacity-10 text-danger d-flex align-items-center justify-content-center" style="width: 44px; height: 44px;">
              <i class="bi bi-exclamation-circle fs-5"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm rounded-4 mt-3">
    <div class="card-body p-3">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md-2">
          <label class="form-label small text-muted mb-1">Fecha Desde</label>
          <input type="date" id="filtro_fecha_desde" class="form-control shadow-none">
        </div>
        <div class="col-12 col-md-2">
          <label class="form-label small text-muted mb-1">Fecha Hasta</label>
          <input type="date" id="filtro_fecha_hasta" class="form-control shadow-none">
        </div>
        <div class="col-12 col-md-3">
          <label class="form-label small text-muted mb-1">Buscar por Nombre</label>
          <input type="text" id="filtro_nombre" class="form-control shadow-none" placeholder="Ej. Ana, Carlos...">
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label small text-muted mb-1">Tipo</label>
          <select id="filtro_tipo" class="form-select shadow-none">
            <option value="" selected>Todos</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label small text-muted mb-1">Categoría</label>
          <select id="filtro_categoria" class="form-select shadow-none">
            <option value="" selected>Todas</option>
          </select>
        </div>
        <div class="col-12 col-md-1">
          <button type="button" class="btn btn-primary w-100" id="btn_filtrar_asistencia">Filtrar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm rounded-4 mt-3">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Empleado</th>
            <th>Tipo</th>
            <th>Categoría</th>
          </tr>
        </thead>
        <tbody id="tbody_asistencia_admin"></tbody>
      </table>
    </div>
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2 p-2 border-top">
      <div class="small text-muted" id="asistencia_page_info">Mostrando 0 de 0</div>
      <div class="d-flex align-items-center gap-2">
        <select id="asistencia_page_size" class="form-select form-select-sm" style="width: auto;">
          <option value="10" selected>10</option>
          <option value="25">25</option>
          <option value="50">50</option>
        </select>
        <div class="btn-group" role="group" aria-label="Paginación asistencia">
          <button type="button" class="btn btn-outline-secondary btn-sm" id="asistencia_prev">Anterior</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="asistencia_next">Siguiente</button>
        </div>
      </div>
    </div>
  </div>
</div>
