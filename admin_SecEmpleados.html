<div id="sec_empleados" class="d-none">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
    <div>
      <div class="h4 mb-0">Usuarios</div>
      <div class="text-muted small">Gestión básica de usuarios (Rol y Estado).</div>
    </div>
    <button type="button" class="btn btn-primary" id="btn_nuevo_usuario">
      <i class="bi bi-person-plus me-2"></i>Nuevo Usuario
    </button>
  </div>

  <div class="card border-0 shadow-sm rounded-4 mt-3">
    <div class="card-body p-3">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md-6 col-lg-5">
          <label class="form-label small text-muted mb-1">Buscar</label>
          <input type="text" id="buscar_usuario_admin" class="form-control shadow-none" placeholder="ID, nombre, identificación, correo, cargo...">
        </div>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm rounded-4 mt-3">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Identificación</th>
            <th>Correo</th>
            <th>Cargo</th>
            <th>Rol</th>
            <th>Estado</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody_usuarios_admin"></tbody>
      </table>
    </div>
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2 p-2 border-top">
      <div class="small text-muted" id="usuarios_page_info">Mostrando 0 de 0</div>
      <div class="d-flex align-items-center gap-2">
        <select id="usuarios_page_size" class="form-select form-select-sm" style="width: auto;">
          <option value="10" selected>10</option>
          <option value="25">25</option>
          <option value="50">50</option>
        </select>
        <div class="btn-group" role="group" aria-label="Paginación usuarios">
          <button type="button" class="btn btn-outline-secondary btn-sm" id="usuarios_prev">Anterior</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="usuarios_next">Siguiente</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modal_usuario_admin" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="form_usuario_admin">
        <div class="modal-header">
          <h5 class="modal-title" id="modal_usuario_titulo">Usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="usuario_id">

          <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" class="form-control" id="usuario_correo" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Nombre Completo</label>
            <input type="text" class="form-control" id="usuario_nombre" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Identificación</label>
            <input type="text" class="form-control" id="usuario_identificacion" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <div class="input-group">
              <input type="password" class="form-control" id="usuario_password" placeholder="Deja vacío para no cambiar">
              <button class="btn btn-outline-secondary" type="button" id="btn_toggle_pass_admin" aria-label="Mostrar contraseña" aria-pressed="false">
                <i class="bi bi-eye" id="icon_toggle_pass_admin"></i>
              </button>
            </div>
            <div class="form-text">Si es un usuario nuevo y dejas vacío, se usará la Identificación como contraseña inicial.</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Cargo</label>
            <input type="text" class="form-control" id="usuario_cargo" required>
          </div>

          <div class="mb-0">
            <label class="form-label">Rol</label>
            <select class="form-select" id="usuario_rol_id" required>
              <option value="1">Usuario</option>
              <option value="2">TH</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn_guardar_usuario">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
