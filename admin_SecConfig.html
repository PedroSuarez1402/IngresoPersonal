<div id="sec_configuracion" class="d-none">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
    <div>
      <div class="h4 mb-0">Configuración de Horarios</div>
      <div class="text-muted small">Administra las reglas para evaluar marcaciones.</div>
    </div>
    <button type="button" class="btn btn-primary" id="btn_nueva_regla">
      <i class="bi bi-plus-circle me-2"></i>Nueva Regla
    </button>
  </div>

  <div class="card border-0 shadow-sm rounded-4 mt-3">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Etapa</th>
            <th>Inicio</th>
            <th>Fin</th>
            <th>Ideal</th>
            <th>Descripción</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody_config_admin"></tbody>
      </table>
    </div>
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2 p-2 border-top">
      <div class="small text-muted" id="config_page_info">Mostrando 0 de 0</div>
      <div class="d-flex align-items-center gap-2">
        <select id="config_page_size" class="form-select form-select-sm" style="width: auto;">
          <option value="10" selected>10</option>
          <option value="25">25</option>
          <option value="50">50</option>
        </select>
        <div class="btn-group" role="group" aria-label="Paginación configuración">
          <button type="button" class="btn btn-outline-secondary btn-sm" id="config_prev">Anterior</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="config_next">Siguiente</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modal_config_regla" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="form_config_regla">
        <div class="modal-header">
          <h5 class="modal-title" id="modal_config_titulo">Regla</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="config_id">

          <div class="mb-3">
            <label class="form-label">Etapa</label>
            <input type="text" class="form-control" id="config_etapa" required>
          </div>

          <div class="row g-2">
            <div class="col-12 col-md-4">
              <label class="form-label">Hora Inicio</label>
              <input type="time" class="form-control" id="config_inicio" required>
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label">Hora Fin</label>
              <input type="time" class="form-control" id="config_fin" required>
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label">Hora Ideal</label>
              <input type="time" class="form-control" id="config_ideal" required>
            </div>
          </div>

          <div class="mt-3">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" id="config_descripcion" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn_guardar_regla">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
